<!DOCTYPE html>
<html>
  <head>
    <script src="projects/sectionGenerator.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <header>Javascript Playground</header>

    <div id="main">
      <div id="sidebar">
        <h2>Projects</h2>
        <ul id="project-list"></ul>
      </div>
      <div id="content">
        <div id="project-header">Select a project</div>
        <iframe id="project-frame"></iframe>
      </div>
    </div>

    <footer class="footer">
      <p>
        Edwin Game Dev &copy;
        <span id="date">
            <script>
              document
                .getElementById("date")
                .appendChild(document.createTextNode(new Date().getFullYear()));
            </script>
        </span>
      </p>
    </footer>
  </body>
</html>
